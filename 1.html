<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satpol PP – Dashboard Trantibum</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" />
  <style>
    :root{
      --brand:#0a6aa1;
      --brand-2:#0c7ca8;
      --brand-3:#e6f2fa;
      --text:#1a1a1a;
      --muted:#5a5a5a;
      --bg:#ffffff;
      --bg-2:#f6f8f7;
      --danger:#b00020;
      --warning:#a26d00;
      --ok:#0b6e11;
    }
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.5}
    .container{max-width:1200px;margin-inline:auto;padding:0 16px}
    h2{margin:0 0 14px;font-size:26px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{background:#fff;border:1px solid #e9ecef;border-radius:14px;overflow:hidden}
    .card.shadow{box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .card .p{padding:14px}
    .lead{color:var(--muted)}
    .hint{font-size:12px;color:var(--muted)}
    .btn{background:var(--brand);color:#fff;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600}
    .btn.small{padding:4px 8px}
  </style>
</head>
<body>
  <main class="container">
    <section id="dashboard" aria-label="Ringkasan Trantibum">
      <h2>Ringkasan Trantibum</h2>
      <div class="grid-2">
        <div class="card shadow">
          <div class="p">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <b>Rekap Pengaduan</b>
              <div style="display:flex;gap:6px">
                <button class="btn small" id="btnDaily">Harian</button>
                <button class="btn small" id="btnMonthly">Bulanan</button>
              </div>
            </div>
            <canvas id="chartRekap" height="200"></canvas>
            <div class="hint">Sumber: internal Satpol PP Kaltara</div>
          </div>
        </div>
        <div class="card shadow">
          <div class="p">
            <b>Peta Rawan Pelanggaran</b>
            <div id="mapRawan" style="height:360px;border-radius:12px;overflow:hidden"></div>
            <div class="hint">Level kerawanan 1–5 (hijau→kuning→merah)</div>
          </div>
        </div>
      </div>
    </section>

    <section aria-label="Statistik Kinerja">
      <h2>Statistik Kinerja</h2>
      <div class="grid-3">
        <div class="card shadow"><div class="p"><b>Total Aduan</b><div class="lead"><b id="stA">453</b> bulan ini</div></div></div>
        <div class="card shadow"><div class="p"><b>Rata-rata Respons</b><div class="lead"><b id="stB">15 Menit</b></div></div></div>
        <div class="card shadow"><div class="p"><b>Aduan Selesai</b><div class="lead"><b id="stC">92%</b></div></div></div>
      </div>
    </section>

    <section aria-label="Breakdown Kategori">
      <h2>Breakdown Kategori</h2>
      <div class="grid-2">
        <div class="card shadow">
          <div class="p">
            <b>Jenis Pelanggaran</b>
            <canvas id="chartPelanggaran" height="220"></canvas>
          </div>
        </div>
        <div class="card shadow">
          <div class="p">
            <b>Perda Teratas</b>
            <canvas id="chartPerda" height="220"></canvas>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Chart Rekap
    new Chart(document.getElementById('chartRekap'), {
      type: 'line',
      data: {
        labels: ['01','02','03','04','05','06','07','08','09','10'],
        datasets: [
          { label:'Satpol PP', data:[15,12,18,10,20,14,16,11,19,13], borderColor:'var(--brand)', fill:true },
          { label:'Damkar', data:[5,8,3,7,2,6,9,4,1,10], borderColor:'var(--danger)', fill:true }
        ]
      }
    });

    // Chart Pelanggaran
    new Chart(document.getElementById('chartPelanggaran'), {
      type: 'bar',
      data: { labels:['PKL','Lalin','Sampah','Bangunan','Hiburan'],
              datasets:[{ label:'Jumlah Aduan', data:[110,85,60,45,30], backgroundColor:'var(--warning)' }] },
      options:{ indexAxis:'y' }
    });

    // Chart Perda
    new Chart(document.getElementById('chartPerda'), {
      type: 'bar',
      data: { labels:['No.7/2014','No.3/2012','No.11/2018'],
              datasets:[{ label:'Jumlah Kasus', data:[150,100,75], backgroundColor:'var(--ok)' }] },
      options:{ indexAxis:'y' }
    });

    // Leaflet Map
    const map = L.map('mapRawan').setView([2.843,117.37], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'&copy; OpenStreetMap'
    }).addTo(map);
  </script>
</body>
</html>
